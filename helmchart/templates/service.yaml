apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vm-kopswa-app
  labels:
    app: vm-kopswa-app
spec:
  selector:
    app: vm-kopswa-app
  ports:
    - protocol: TCP
      port: {{ .Values.services.vm-kopswa-app.port }}
      targetPort: {{ .Values.services.vm-kopswa-app.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vm-kopswa-db
  labels:
    app: vm-kopswa-db
spec:
  selector:
    app: vm-kopswa-db
  ports:
    - protocol: TCP
      port: {{ .Values.services.vm-kopswa-db.port }}
      targetPort: {{ .Values.services.vm-kopswa-db.port }}
  type: ClusterIP
